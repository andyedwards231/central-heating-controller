<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heating dashboard preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#1d2939;font:16px system-ui;--primary-text-color:#1d2939;--secondary-text-color:#667085;--card-background-color:#fff;--primary-color:#007ba8;--divider-color:#e4e7ec}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:white;border-bottom:1px solid #e4e7ec}header strong{font-size:22px}header span{font-size:12px;color:#667085}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px;background:white;position:sticky;top:0;z-index:1}nav button{border:0;padding:12px 24px;border-radius:8px;background:transparent;font:inherit;color:#667085;cursor:pointer}nav button[aria-selected=true]{background:#e4f3f8;color:#006480;font-weight:650}main{padding:24px}ha-card{display:block;background:white;border-radius:14px}@media(max-width:600px){main{padding:10px}header{padding:16px}header span{max-width:160px;text-align:right}nav{padding:8px}nav button{flex:1;padding:10px}nav label{width:100%;justify-content:flex-end}}
</style></head><body><header><strong>Heating</strong><span>Preview with sample data · commands are simulated</span></header><nav aria-label="Heating views"><button data-mode="overview" aria-selected="true">Now</button><button data-mode="schedule" aria-selected="false">Comfort times</button><button data-mode="learning" aria-selected="false">Learning</button></nav><p id="fixture-message" role="status" style="margin:0 24px"></p><main id="dashboard"></main><details style="margin:16px 28px;font-size:13px"><summary>Preview controls</summary><label style="margin-left:auto;display:flex;align-items:center;gap:8px">Readiness sample<select id="readiness-sample"><option value="learning">Learning</option><option value="ready">Ready</option><option value="active">Active</option><option value="fallback">Fallback</option></select></label><button id="refresh" style="margin:12px 24px">Refresh sample readings</button><label><input type="checkbox" id="reject-setting"> Simulate a failed setting save</label></details><script type="module">
import '../../www/central-heating-controller-card.js';
import {createHass} from '../js/fixtures.mjs';
const base='central_heating_controller';const now=Date.now();
const days=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const inheritedWeek=Object.fromEntries(days.map(day=>[day,[{start:'07:00',end:'09:00'},{start:'17:00',end:'22:00'}]]));
const localClock=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function temperatureCurve(preheat=false){let temp=19.8;return Array.from({length:289},(_,i)=>{const at=new Date(now+i*300000);const [h,m]=localClock.format(at).split(':').map(Number);const minute=h*60+m;const warm=(minute>=(preheat?360:420)&&minute<540)||(minute>=(preheat?960:1020)&&minute<1320);const target=warm?20:(minute<420||minute>=1380?16:preheat?18:16);const demand=temp<target-0.1?65:temp<target+0.05?20:0;const row={datetime:at.toISOString(),temperature:temp,target_temperature:target,heating_demand_percent:demand};temp+=(2.7*demand/100-0.04*(temp-8))/12;return row;});}
const points=temperatureCurve();
const attributes={forecast:points,temperature_unit:'°C',confidence:'learning',learned_samples:74,heating_response_learned:true,heating_response_minutes:18,demand_model_learned:false,current_heating_demand_percent:28,forecast_accuracy:{'1h':{mae_c:0.23,count:18},'6h':{mae_c:0.47,count:12},'24h':{mae_c:null,count:0}}};
const hass=createHass({states:{
 [`sensor.${base}_status`]:{state:'low',attributes:{current_temperature:19.8,effective_target_temperature:points[0].target_temperature,current_heating_demand_percent:points[0].heating_demand_percent,climate_entity:'climate.hall',schedule_entity:'schedule.heating'}},
 [`sensor.${base}_effective_target_temperature`]:{state:String(points[0].target_temperature),attributes:{unit_of_measurement:'°C'}},
 [`number.${base}_high_temperature`]:{state:'20',attributes:{unit_of_measurement:'°C',min:7,max:30,step:0.5}},
 [`select.${base}_controller_mode`]:{state:'auto',attributes:{options:['auto','away','off']}},
 [`sensor.${base}_preheat_start_time`]:{state:'unknown',attributes:{}},
 [`sensor.${base}_indoor_temperature_forecast`]:{state:'19.1',attributes},
 [`sensor.${base}_predicted_heating_cost_today`]:{state:'1.84',attributes:{unit_of_measurement:'GBP',calibration:{observation_count:1860,sample_count:76,first_observation:new Date(now-172800000).toISOString(),last_observation:new Date(now).toISOString()}}},
 [`sensor.${base}_predicted_heating_cost_tomorrow`]:{state:'unknown',attributes:{unit_of_measurement:'GBP',reason:'Waiting for sufficient weather coverage'}},
 [`sensor.${base}_smart_heating_plan`]:{state:'preview',attributes:{preview:true,temperature_unit:'°C',explanation:'Your current schedule remains in control. This proposed plan is still learning.',forecast:temperatureCurve(true),schedule_source:'existing_schedule',schedule_entity:'schedule.heating',existing_schedule:inheritedWeek,settings:{enabled:true,night_start:'23:00',night_end:'07:00',night_temperature:16,daytime_drop:2,weekly_schedule:{}}}},
 [`sensor.${base}_smart_heating_readiness`]:{state:'learning',attributes:{ready:false,control_state:'preview',live_control_enabled:false,explanation:'The controller is collecting enough heating and forecast readings.',checks:[{key:'thermal_windows',label:'Heating history',passed:false,detail:'4 of 40 thermal windows recorded.'},{key:'accuracy_24h',label:'Forecast accuracy',passed:false,detail:'Waiting for enough measured forecast results.'}],blockers:['More heating history is needed.']}},
 [`switch.${base}_smart_heating_control`]:{state:'off',attributes:{friendly_name:'Smart heating control'}}
},hass:{locale:{language:'en-GB',time_format:'24',time_zone:'server'},config:{time_zone:'Europe/London'}}});
const cards={};
const refreshCards=()=>{for(const card of Object.values(cards))card.hass={...hass,states:{...hass.states}};};
const recordCall=hass.callService.bind(hass);
hass.callService=async(domain,service,data)=>{
 await recordCall(domain,service,data);
 if(document.querySelector('#reject-setting').checked)throw new Error('Simulated service failure');
 if(domain==='number')hass.states[data.entity_id]={...hass.states[data.entity_id],state:String(data.value)};
 if(domain==='central_heating_controller'){
  const plan=hass.states[`sensor.${base}_smart_heating_plan`];
  const {entity_id,...settings}=data;
  plan.attributes={...plan.attributes,settings,schedule_source:Object.values(settings.weekly_schedule||{}).some(p=>p.length)?'integration':'existing_schedule'};
 }
 if(domain==='select'){
  hass.states[data.entity_id]={...hass.states[data.entity_id],state:data.option};
  const status=hass.states[`sensor.${base}_status`];
  const target=data.option==='off'?null:data.option==='away'?14:points[0].target_temperature;
  hass.states[`sensor.${base}_status`]={...status,state:data.option==='auto'?'low':data.option,attributes:{...status.attributes,effective_target_temperature:target,current_heating_demand_percent:0}};
  hass.states[`sensor.${base}_effective_target_temperature`]={state:target===null?'unknown':String(target),attributes:{unit_of_measurement:'°C'}};
  hass.states[`sensor.${base}_indoor_temperature_forecast`]={state:'18',attributes:{...attributes,forecast:data.option==='auto'?points:points.map((p,i)=>({...p,target_temperature:target,heating_demand_percent:0,temperature:Math.max(target??8,19.8-i*0.015)}))}};
 }
 if(domain==='switch'){
  hass.states[data.entity_id]={...hass.states[data.entity_id],state:service==='turn_on'?'on':'off'};
  const ready=hass.states[`sensor.${base}_smart_heating_readiness`];
  ready.attributes={...ready.attributes,control_state:service==='turn_on'?'active':'preview'};
 }
 refreshCards();
};
document.addEventListener('hass-more-info',event=>{document.querySelector('#fixture-message').textContent=`Home Assistant opens ${event.detail.entityId} with its settings and history.`;});
document.addEventListener('click',event=>{const link=event.composedPath().find(node=>node.tagName==='A');const match=link?.getAttribute('href')?.match(/^\/dashboard-heating\/(overview|schedule|learning)$/);if(match){event.preventDefault();show(match[1]);}});
function show(mode){let card=cards[mode];if(!card){card=document.createElement('central-heating-controller-card');card.setConfig({entity:`sensor.${base}_status`,mode,title:{overview:'Heating',schedule:'Comfort times',learning:'Learning'}[mode]});card.hass=hass;cards[mode]=card;}document.querySelector('#dashboard').replaceChildren(card);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.mode));document.querySelector('#refresh').onclick=()=>{const state=hass.states[`sensor.${base}_status`];hass.states[`sensor.${base}_status`]={...state,attributes:{...state.attributes,current_temperature:19.9}};refreshCards();};show('overview');
document.querySelector('#readiness-sample').onchange=event=>{const sample=event.target.value;const ready=sample==='ready'||sample==='active';const active=sample==='active';const fallback=sample==='fallback';const checks=[{key:'thermal_windows',label:'Heating history',passed:ready,detail:ready?'40 of 40 thermal windows recorded.':'4 of 40 thermal windows recorded.'},{key:'accuracy_24h',label:'Forecast accuracy',passed:ready,detail:ready?'Forecast accuracy is within the required range.':'Waiting for enough measured forecast results.'}];hass.states[`sensor.${base}_smart_heating_readiness`]={state:ready?'ready':sample==='learning'?'learning':'blocked',attributes:{ready,control_state:active?'active':fallback?'fallback':'preview',live_control_enabled:active||fallback,explanation:active?'The plan is running automatically.':fallback?'The controller returned to your current schedule.':ready?'All requirements have passed. Enable intelligent heating when you are ready.':'The controller is collecting enough heating and forecast readings.',fallback_reason:fallback?'Forecast input is temporarily unavailable.':undefined,checks,blockers:ready?[]:['More heating history is needed.']}};hass.states[`switch.${base}_smart_heating_control`]={state:active||fallback?'on':'off',attributes:{friendly_name:'Smart heating control'}};const plan=hass.states[`sensor.${base}_smart_heating_plan`];if(active){plan.state='active';plan.attributes.preview=false;plan.attributes.explanation='The learned plan is controlling heating.';}else{plan.state='preview';plan.attributes.preview=true;plan.attributes.explanation=fallback?'Your existing schedule is controlling heating because forecast input is unavailable.':'Your current schedule remains in control. This proposed plan is ready for review.';}hass.states[`sensor.${base}_indoor_temperature_forecast`]={state:'18',attributes:{...attributes,forecast:active?plan.attributes.forecast:points}};for(const card of Object.values(cards))card.hass={...hass,states:{...hass.states}};};show('overview');
</script></body></html>
