<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heating dashboard preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#1d2939;font:16px system-ui;--primary-text-color:#1d2939;--secondary-text-color:#667085;--card-background-color:#fff;--primary-color:#007ba8;--divider-color:#e4e7ec}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:white;border-bottom:1px solid #e4e7ec}header strong{font-size:22px}header span{font-size:12px;color:#667085}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px;background:white;position:sticky;top:0;z-index:1}nav button{border:0;padding:12px 24px;border-radius:8px;background:transparent;font:inherit;color:#667085;cursor:pointer}nav button[aria-selected=true]{background:#e4f3f8;color:#006480;font-weight:650}main{padding:24px}ha-card{display:block;background:white;border-radius:14px}@media(max-width:600px){main{padding:10px}header{padding:16px}header span{max-width:160px;text-align:right}nav{padding:8px}nav button{flex:1;padding:10px}nav label{width:100%;justify-content:flex-end}}
</style></head><body><header><strong>Heating</strong><span>Preview with sample data · commands are simulated</span></header><nav aria-label="Heating views"><button data-mode="overview" aria-selected="true">Overview</button><button data-mode="schedule" aria-selected="false">Schedule</button><button data-mode="learning" aria-selected="false">Learning</button><label style="margin-left:auto;display:flex;align-items:center;gap:8px">Readiness sample<select id="readiness-sample"><option value="learning">Learning</option><option value="ready">Ready</option><option value="active">Active</option><option value="fallback">Fallback</option></select></label></nav><button id="refresh" style="margin:12px 24px">Refresh sample readings</button><main id="dashboard"></main><script type="module">
import '../../www/central-heating-controller-card.js';
import {createHass} from '../js/fixtures.mjs';
const base='central_heating_controller';const now=Date.now();
const points=Array.from({length:289},(_,i)=>({datetime:new Date(now+i*300000).toISOString(),temperature:19.1+0.7*Math.cos(i/37),target_temperature:i<65||i>210?20:18,heating_demand_percent:i<25||i>200&&i<245?60:0}));
const attributes={forecast:points,temperature_unit:'°C',confidence:'learning',learned_samples:74,heating_response_learned:true,heating_response_minutes:18,demand_model_learned:false,current_heating_demand_percent:28,forecast_accuracy:{'1h':{mae_c:0.23,count:18},'6h':{mae_c:0.47,count:12},'24h':{mae_c:null,count:0}}};
const hass=createHass({states:{
 [`sensor.${base}_status`]:{state:'high',attributes:{current_temperature:19.8,effective_target_temperature:20}},
 [`sensor.${base}_effective_target_temperature`]:{state:'20',attributes:{unit_of_measurement:'°C'}},
 [`number.${base}_high_temperature`]:{state:'20',attributes:{unit_of_measurement:'°C',min:7,max:30,step:0.5}},
 [`select.${base}_controller_mode`]:{state:'auto',attributes:{options:['auto','away','off']}},
 [`sensor.${base}_preheat_start_time`]:{state:'unknown',attributes:{}},
 [`sensor.${base}_indoor_temperature_forecast`]:{state:'19.1',attributes},
 [`sensor.${base}_predicted_heating_cost_today`]:{state:'1.84',attributes:{unit_of_measurement:'GBP',calibration:{observation_count:1860,sample_count:76,first_observation:new Date(now-172800000).toISOString(),last_observation:new Date(now).toISOString()}}},
 [`sensor.${base}_predicted_heating_cost_tomorrow`]:{state:'unknown',attributes:{unit_of_measurement:'GBP',reason:'Waiting for sufficient weather coverage'}},
 [`sensor.${base}_smart_heating_plan`]:{state:'preview',attributes:{preview:true,temperature_unit:'°C',explanation:'Your current schedule remains in control. This proposed plan is still learning.',forecast:points.map(p=>({...p,temperature:p.temperature+0.1})),settings:{enabled:true,night_start:'23:00',night_end:'07:00',night_temperature:16,daytime_drop:2,weekly_schedule:Object.fromEntries(['monday','tuesday','wednesday','thursday','friday','saturday','sunday'].map(d=>[d,[{start:'07:00',end:'09:00'},{start:'17:00',end:'22:00'}]]))}}},
 [`sensor.${base}_smart_heating_readiness`]:{state:'learning',attributes:{ready:false,control_state:'preview',live_control_enabled:false,explanation:'The controller is collecting enough heating and forecast readings.',checks:[{key:'samples',label:'Heating history',passed:false,detail:'4 of 40 thermal windows recorded.'},{key:'forecast',label:'Forecast accuracy',passed:false,detail:'Waiting for enough measured forecast results.'}],blockers:['More heating history is needed.']}},
 [`switch.${base}_smart_heating_control`]:{state:'off',attributes:{friendly_name:'Smart heating control'}}
},hass:{locale:{language:'en-GB',time_format:'24',time_zone:'server'},config:{time_zone:'Europe/London'}}});
const cards={};function show(mode){let card=cards[mode];if(!card){card=document.createElement('central-heating-controller-card');card.setConfig({entity:`sensor.${base}_status`,mode,title:{overview:'Heating',schedule:'Comfort schedule',learning:'Learning and accuracy'}[mode]});card.hass=hass;cards[mode]=card;}document.querySelector('#dashboard').replaceChildren(card);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.mode));document.querySelector('#refresh').onclick=()=>{for(const card of Object.values(cards)){card.hass={...card.hass,states:{...card.hass.states,[`sensor.${base}_status`]:{state:'high',attributes:{current_temperature:19.9,effective_target_temperature:20}}}}}};show('overview');
document.querySelector('#readiness-sample').onchange=event=>{const sample=event.target.value;const ready=sample==='ready'||sample==='active';const active=sample==='active';const fallback=sample==='fallback';const checks=[{key:'samples',label:'Heating history',passed:ready,detail:ready?'40 of 40 thermal windows recorded.':'4 of 40 thermal windows recorded.'},{key:'forecast',label:'Forecast accuracy',passed:ready,detail:ready?'Forecast accuracy is within the required range.':'Waiting for enough measured forecast results.'}];hass.states[`sensor.${base}_smart_heating_readiness`]={state:ready?'ready':sample==='learning'?'learning':'blocked',attributes:{ready,control_state:active?'active':fallback?'fallback':'preview',live_control_enabled:active||fallback,explanation:active?'The plan is running automatically.':fallback?'The controller returned to your current schedule.':ready?'All requirements have passed. Enable intelligent heating when you are ready.':'The controller is collecting enough heating and forecast readings.',fallback_reason:fallback?'Forecast input is temporarily unavailable.':undefined,checks,blockers:ready?[]:['More heating history is needed.']}};hass.states[`switch.${base}_smart_heating_control`]={state:active||fallback?'on':'off',attributes:{friendly_name:'Smart heating control'}};const plan=hass.states[`sensor.${base}_smart_heating_plan`];if(active){plan.state='active';plan.attributes.preview=false;plan.attributes.explanation='The learned plan is controlling heating.';}else{plan.state='preview';plan.attributes.preview=true;plan.attributes.explanation=fallback?'Your existing schedule is controlling heating because forecast input is unavailable.':'Your current schedule remains in control. This proposed plan is ready for review.';}for(const card of Object.values(cards))card.hass={...hass,states:{...hass.states}};};show('overview');
</script></body></html>
